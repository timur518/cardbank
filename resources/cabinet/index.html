    <!-- PWA: манифест + иконки дают браузеру возможность предложить установку на рабочий

         apple-touch-icon ниже при ручной установке через «Поделиться». -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3A3C40" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=sofia-sans:400,500,600,700,800&display=swap" rel="stylesheet" />
</head>
